services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: nexora
      POSTGRES_PWD: nexora_local_only
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.40.1
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nexora:nexora_local_only@postgres:5432/nexora
      TEMPORAL_ADDRESS: temporal:7233
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    volumes:
      - project_data:/app/data

  worker:
    build: .
    depends_on:
      api:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nexora:nexora_local_only@postgres:5432/nexora
      TEMPORAL_ADDRESS: temporal:7233
    command: ["python", "-m", "worker.main"]
    volumes:
      - project_data:/app/data

  web:
    build: apps/web
    depends_on:
      - api
    ports:
      - "5173:80"

  openhands-agent-server:
    image: ${OPENHANDS_IMAGE:-ghcr.io/openhands/agent-server:latest-python}
    profiles: ["openhands"]
    environment:
      SESSION_API_KEY: ${OPENHANDS_API_KEY:-local-development-only}
    ports:
      - "3000:8000"

volumes:
  postgres_data:
  project_data:
